# ============================================
# ARCHIX - Development Profile
# ============================================
# Activé avec: SPRING_PROFILES_ACTIVE=dev

# Database (local PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/archix-db
spring.datasource.username=postgres
spring.datasource.password=khalid123

# JPA - Mode développement
# Use 'create' to recreate schema (data will be lost) or 'update' for incremental changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT - Dev secret (NE PAS UTILISER EN PROD)
jwt.secret=dff0d6d477a55fc7208a1095f8db44d66fb61af831cd5a4a22e1c02e20080b11

# MinIO local (optional in dev - app will start even if MinIO is down)
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.auto-create-bucket=true
minio.fail-on-error=false

# CORS permissif en dev
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Logging verbose
logging.level.archix_base=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
