# ============================================
# ARCHIX - Docker Profile
# ============================================
# Activé avec: SPRING_PROFILES_ACTIVE=docker


# Database - Nom du service Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/${DATABASE_NAME:archix_db}

# Redis - Nom du service Docker
spring.data.redis.host=redis

# MinIO - Nom du service Docker
minio.endpoint=http://minio:9000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.archix_base=INFO
