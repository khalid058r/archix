
# Application
server.port=${SERVER_PORT:8081}
spring.application.name=archix-base
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Disable Redis auto-configuration (not needed for local dev)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/archix-db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:khalid123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# SECURITY (JWT)
# ============================================
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_256_BIT_KEY_MINIMUM_32_CHARS}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============================================
# MINIO (Object Storage)
# ============================================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET:archix-documents}
minio.fail-on-error=${MINIO_FAIL_ON_ERROR:false}

# ============================================
# LOCAL STORAGE (Fallback when MinIO is unavailable)
# Set to true for local development without Docker
# ============================================
storage.local.enabled=${STORAGE_LOCAL_ENABLED:true}

# ============================================
# REDIS (Cache & Session)
# ============================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ============================================
# API DOCUMENTATION (Swagger/OpenAPI)
# ============================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================
# FILE UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# ============================================
# CORS
# ============================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ============================================
# LOGGING
# ============================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.archix_base=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# ============================================
# ACTUATOR (Health Checks)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
